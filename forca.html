<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forca.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link type="text/css" rel="stylesheet" href="https://cdn.rybena.com.br/dom/font/Dislexia/Dislexia.css">

    <title>Document</title>
</head>
<body>
    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario</title>
    </head>
    <body>
        <div class="container">
            <div class="form-image">
                <img src="napneColor.png" alt="">
            </div>
        <form action="/enviar" method="post" enctype="multipart/form-data">
            <div class="form-header">
                <div class="title">
                    <h1>Cadastrar Notícias</h1>
                </div>
            </div>
            <div class="input-group">
                <div class="input-box">
                    <label for="titulo">Título</label>
                    <input type="text" name="titulo" id="titulo" >
                </div>
            
                <div class="input-box">
                    <label for="descricao">Descrição</label>
                    <input type="text" name="descricao" id="descricao">
                </div>
        
                <div class="input-box">
                    <label for="arq">Imagem</label>
                    <input type="file" name="arq" id="arq">
                </div>
                
                <div class="input-box">
                    <label for="noticia_externa">Noticia Externa</label>
                    <input type="text" name="noticia_externa" id="noticia_externa">
                </div>
            </div>
            <div class="continue-button">
                <input type="submit" value="Cadastrar">
            </div>
        </form>
    </body>
    </html>
    
</body>

<script src="java.js"></script>


</html>
