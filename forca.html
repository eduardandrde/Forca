<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forca.css">
    <title>Document</title>
</head>
<body>
    <div class="accessibility-menu">
        <button class="accessibility-toggle">+ Acessibilidade</button>
        <div class="accessibility-panel">
          <div class="contrast-options">
            <button onclick="setContrast('light')">Contraste claro</button>
            <button onclick="setContrast('dark')">Contraste escuro</button>
            <button onclick="setContrast('invert')">Contraste invertido</button>
          </div>
          <div class="font-options">
            <button onclick="adjustFontSize(1)">A+</button>
            <button onclick="adjustFontSize(-1)">A-</button>
            <button onclick="resetFontSize()">Resetar Fonte</button>
          </div>
          <div class="color-options">
            <label for="color-picker">Texto:</label>
            <input type="color" id="color-picker" onchange="setTextColor(this.value)">
          </div>
        </div>
      </div>
      
</body>
<script>
    const palavras = ["javascript", "programacao", "computador","desenvolvimento"];
    let palavraSorteada;
    let tracosPalavra;
    let letrasChutadas;
    let tentativas;
    let erros;
    let acertos;

    function comecarJogo(){
        palavraSorteada = palavras[Math.floor(Math.random() * palavras.length)];
        console.log(palavraSorteada);

        tracosPalavra = Array(palavraSorteada.length).fill('_');
        console.log(tracosPalavra);

        letrasChutadas =[];

        tentativas = 6; 

        erros = 0;

        atualizarPalavra();
    }
    function atualizarPalavra(){
        document.getElementById("exibirTracos").innerText = tracosPalavra;
        document.getElementById("letras-chutadas").innerText =letrasChutadas;
    }
    function verificarLetra(){
        const letraEnviada = document.getElementById('letra_usuario');
        const letra = letraEnviada.value.toLowerCase();
        if(palavraSorteada.includes(letra)){
            for(let i=0; i< palavraSorteada.length; i++){
                if(palavraSorteada[i]===letra){
                    tracosPalavra[i] = letra;
                }
            }
        }else{
            tentativas--;
            erros++;
            letrasChutadas.push(letra)
        }
        if(tentativas===0){
            alert("Você consegue fazer melhor. Tenta mais uma!");
            comecarJogo();
            return;
        }else if(!tracosPalavra.includes('_')){
            alert("Você ganhou!");
            comecarJogo();
        }
        letraEnviada.value = '';
        atualizarPalavra();
    }
    // Abrir e fechar o menu de acessibilidade
document.querySelector('.accessibility-toggle').addEventListener('click', function () {
  const panel = document.querySelector('.accessibility-panel');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
});

// Alterar contraste
function setContrast(mode) {
  if (mode === 'light') {
    document.body.style.filter = 'none';
  } else if (mode === 'dark') {
    document.body.style.filter = 'brightness(50%)';
  } else if (mode === 'invert') {
    document.body.style.filter = 'invert(1)';
  }
}

// Ajustar tamanho da fonte
let fontSize = 16;
function adjustFontSize(change) {
  fontSize += change;
  document.body.style.fontSize = fontSize + 'px';
}

function resetFontSize() {
  fontSize = 16;
  document.body.style.fontSize = fontSize + 'px';
}

// Alterar cor do texto
function setTextColor(color) {
  document.body.style.color = color;
}

    window.load = comecarJogo();
</script>  

</html>
